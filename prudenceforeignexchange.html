<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prudence FX Exchange</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b1329; /* Deep royal blue background */
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #111e38; /* Rich dark navy card */
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid #1e3a8a;
        }

        .barbdiv {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 25px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #d4af37; /* Elegant gold border */
        }

        .header-content {
            flex-grow: 1;
            text-align: center;
        }

        /* Square Logo Styling */
        .logo-container {
            width: 50px;
            height: 50px;
            background: #0b1329;
            border: 2px solid #d4af37;
            border-radius: 8px; /* Slightly rounded square */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #d4af37; /* Gold letter P */
            font-size: 1.6rem;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2);
            flex-shrink: 0;
        }

        .barbdiv h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #d4af37; /* Gold accent */
        }

        .barbdiv h2 {
            font-size: 0.85rem;
            font-weight: 300;
            color: #cbd5e1;
        }

        .writing {
            text-align: center;
            padding: 25px;
            background-color: #111e38;
        }

        .writing img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 10px;
            border: 2px solid #d4af37;
        }

        .cd {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #d4af37;
            color: #0b1329;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            margin: 0 25px 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2);
        }

        .cord {
            background-color: #0b1329;
            text-align: center;
            margin: 20px;
            padding: 30px 20px;
            color: white;
            border-radius: 15px;
            border: 1px solid #1e3a8a;
        }

        .address {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #d4af37;
        }

        .ex {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .ex button {
            background-color: #111e38;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 12px 20px;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 380px;
        }

        .ex button:hover {
            background-color: #d4af37;
            transform: translateY(-2px);
        }

        .ex button:hover a {
            color: #0b1329;
        }

        .ex a {
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Section with Gold 'P' Square Logo Top-Left -->
        <div class="barbdiv">
            <div class="logo-container">P</div>
            <div class="header-content">
                <h1>PRUDENCE FX EXCHANGE</h1>
                <h2>WE ALSO DEAL ON FOREIGN EXCHANGES</h2>
            </div>
        </div>
        
        <!-- Main Image Section -->
        <div class="writing">
            <img src="dona 2.png" alt="Foreign Exchange" width="600" height="500">
        </div>

        <!-- Info Banners -->
        <div class="cd">WE CHANGE NAIRA AT AN AFFORDABLE PRICE</div>
        <div class="cd"><strong>FOR MORE ENQUIRY CONTACT US: 08036029027</strong></div>

        <!-- Footer / Address & Sister Pages -->
        <div class="cord">
            <div class="address">
                <p><strong>&#127968; ADDRESS: 71 OPPOSITE ST. CHARLES CATHOLIC CHURCH</strong></p>
            </div>
            
            <div class="ex">
                <button><a href="prudencecarwash.html">&rarr; CHECK OUT OUR CAR WASH PAGE</a></button>
                <button><a href="prudencebarbingsallon.html">&rarr; CHECK OUT OUR BARBING SALON PAGE</a></button>
                <button><a href="prudencewineshop.html">&rarr; CHECK OUT OUR WINE SHOP PAGE</a></button>
            </div>
        </div>
    </div>

</body>
</html>
