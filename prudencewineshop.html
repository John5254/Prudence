<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prudence Liquors & Wine</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b1329; /* Deep royal blue background */
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #111e38; /* Rich dark navy card */
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid #1e3a8a;
        }

        .wine {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 25px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #d4af37; /* Elegant gold border */
        }

        .header-content {
            flex-grow: 1;
            text-align: center;
        }

        /* Square Logo Styling */
        .logo-container {
            width: 50px;
            height: 50px;
            background: #0b1329;
            border: 2px solid #d4af37;
            border-radius: 8px; /* Slightly rounded square */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #d4af37; /* Gold letter P */
            font-size: 1.6rem;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2);
            flex-shrink: 0;
        }

        .wine h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #d4af37; /* Gold accent */
        }

        .wine h2 {
            font-size: 0.85rem;
            font-weight: 300;
            color: #cbd5e1;
        }

        .aligner {
            text-align: center;
            padding: 25px;
            background-color: #111e38;
        }

        .img img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 15px;
            border: 2px solid #d4af37;
        }

        .de {
            background-color: #d4af37;
            color: #0b1329;
            border: none;
            border-radius: 30px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            margin: 15px auto;
            display: inline-block;
        }

        .de:hover {
            background-color: #e6c240;
            transform: translateY(-2px);
        }

        .info2 {
            color: white;
            border-radius: 15px;
            padding: 0 20px;
            margin-bottom: 20px;
        }

        .cont1 {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            background: #0b1329;
            border: 1px solid #1e3a8a;
            border-radius: 12px;
            padding: 20px;
        }

        .design, .design2 {
            flex: 1;
            min-width: 280px;
            text-align: center;
        }

        .design h3 {
            color: #d4af37;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .design ol {
            text-align: left;
            padding-left: 20px;
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.8;
            columns: 2; /* Clean double column list for products */
        }

        .contact {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #d4af37;
            font-weight: 600;
        }

        .design2 img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #1e3a8a;
        }

        .core {
            background-color: #0b1329;
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid #1e3a8a;
        }

        .address {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #d4af37;
        }

        .wine1 {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            margin-top: 15px;
        }

        .wine1 button {
            background-color: #111e38;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 12px 20px;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 380px;
        }

        .wine1 button:hover {
            background-color: #d4af37;
            transform: translateY(-2px);
        }

        .wine1 button:hover a {
            color: #0b1329;
        }

        .wine1 a {
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <!-- Header Section with Gold 'P' Square Logo Top-Left -->
        <div class="wine">
            <div class="logo-container">P</div>
            <div class="header-content">
                <h1>PRUDENCE LIQUORS & WINE</h1>
                <h2>WE DEAL ON ALL TYPES OF WINES</h2>
            </div>
        </div>

        <!-- Main Banner & Toggle Button -->
        <div class="aligner">
            <div class="img"><img src="DOHE.png" alt="Wine Shop Display" width="700" height="500"></div>
            <button class="de" onclick="showinformation()"><strong>CHECK SOME OF OUR PRODUCTS HERE &rarr;</strong></button>
        </div>

        <!-- Dynamic Product List Section -->
        <div id="information2" class="info2"></div>

        <!-- Footer / Address & Sister Pages -->
        <div class="core">
            <div class="address">
                <p>&#127968; <strong>ADDRESS:</strong> NO: 25 SARKIN YAKI STREET</p>   
                <div class="wine1">
                    <button><a href="prudencecarwash.html">&rarr; CHECK OUT OUR CAR WASH PAGE</a></button>
                    <button><a href="prudencebarbingsallon.html">&rarr; CHECK OUT OUR BARBING SALON PAGE</a></button>
                    <button><a href="prudenceforeignexchange.html">&rarr; CHECK OUT OUR FOREIGN EXCHANGE PAGE</a></button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let isWineListVisible = false;

        function showinformation() {
            const infoDiv = document.getElementById('information2');
            
            if (isWineListVisible) {
                infoDiv.innerHTML = "";
                isWineListVisible = false;
            } else {
                infoDiv.innerHTML = `
                    <div class="cont1">
                        <div class="design">       
                            <h3><strong>OUR PRODUCT PRICE LIST</strong></h3>
                            <ol>
                                <li>NEW MARTELL</li>
                                <li>OLD MODEL MARTELL</li>
                                <li>JACK DANIELS</li>
                                <li>SCOT HILLS</li>
                                <li>ALL SEASONS</li>
                                <li>BLACK LABELS</li>
                                <li>RED LABELS</li>
                                <li>ESCUDO ROJO</li>
                                <li>JAMESON</li>
                                <li>JAMESON BLACK BARREL</li>
                                <li>AMERICAN HONEY</li>
                                <li>CAMPARI SMALL</li>
                                <li>CAMPARI BIG</li>
                                <li>8PM</li>
                                <li>GOLD ASCONI MERLOT</li>
                                <li>BARON RICHMAN</li>
                                <li>AV MERLOT</li>
                            </ol>
                            <div class="contact"><strong>FOR MORE DRINK DETAILS CONTACT US: 08063779080</strong></div>
                        </div>

                        <div class="design2"> 
                            <img src="PIC.jpg" alt="Wine and Drinks" width="600" height="500">
                            <br><span style="font-size: 0.9rem; color: #cbd5e1; margin-top: 8px; display:inline-block;">WE DEAL ON SELLING OF WINES AND CAN DRINKS</span>
                        </div>
                    </div>
                `;
                isWineListVisible = true;
            }
        }
    </script>

</body>
</html>
